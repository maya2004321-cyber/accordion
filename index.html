<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="accordion">

    <div class="accordion-item">
      <button class="accordion-header">
        <span>ما هو الأكورديون؟</span>
        <span class="icon">+</span>
      </button>
      <div class="accordion-content">
        <p>الأكورديون هو مكون واجهة مستخدم يسمح بعرض وإخفاء المحتوى عند الضغط على العنوان.</p>
      </div>
    </div>

    <div class="accordion-item">
      <button class="accordion-header">
        <span>ما هي استخداماته؟</span>
        <span class="icon">+</span>
      </button>
      <div class="accordion-content">
        <p>يُستخدم عادة في الأسئلة الشائعة (FAQ)، القوائم الجانبية، والإعدادات لتوفير المساحة.</p>
      </div>
    </div>

    <div class="accordion-item">
      <button class="accordion-header">
        <span>هل يمكن فتح أكثر من قسم؟</span>
        <span class="icon">+</span>
      </button>
      <div class="accordion-content">
        <p>نعم، يمكن تعديل الكود ليسمح بفتح أكثر من قسم في نفس الوقت، أو الإبقاء على قسم واحد فقط مفتوح.</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
